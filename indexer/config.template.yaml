# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: monad-courtcast-indexer
description: Real-time CourtCast Markets prediction-market activity on Monad Testnet

contracts:
  - name: PredictionMarket
    events:
      - event: "MarketCreated(uint256 indexed marketId, address indexed creator, string question, uint64 closeAt, uint64 resolveAt)"
      - event: "BetPlaced(uint256 indexed marketId, address indexed bettor, uint8 indexed side, uint256 amount)"
      - event: "MarketFrozen(uint256 indexed marketId)"
      - event: "MarketResolved(uint256 indexed marketId, uint8 indexed outcome)"
      - event: "MarketCancelled(uint256 indexed marketId, uint8 indexed outcome)"
      - event: "MarketVoided(uint256 indexed marketId, address indexed creator)"
      - event: "Claimed(uint256 indexed marketId, address indexed claimant, uint256 amount)"

chains:
  - id: 10143 # Monad Testnet
    # Monad is supported by Envio HyperSync. Do not override it with the
    # wallet-facing public RPC, which is rate-limited for log queries.
    # Use a numeric block for a historical backfill, or "latest" for live-only use.
    start_block: __POINTPULSE_START_BLOCK__
    contracts:
      - name: PredictionMarket
        address: "__POINTPULSE_MARKET_ADDRESS__"
